// Types the Compose compiler should treat as stable, for every module.
//
// Kotlin's read-only collection interfaces are "unstable" by default because
// an implementation *could* be mutable underneath. This codebase never
// mutates a list after putting it in state — state is replaced, not edited —
// so we promise stability here rather than wrapping every list.
//
// Only add a type here if that promise holds everywhere it is used.
// Read-only interfaces only. Never add a wildcard: kotlin.collections.* would
// also cover MutableList, which is genuinely unstable.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
