# The one detekt ruleset for every module, on top of detekt's defaults
# (buildUponDefaultConfig). Change rules here — never per module.

config:
  validation: true
  warningsAsErrors: true
  # Compose rules are a plugin; detekt does not know their keys up front.
  excludes: 'Compose.*'

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    # Tokens are where numbers live; tests read better with literals.
    excludes: ['**/test/**', '**/designsystem/theme/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    # A private @Preview function is used by the IDE, not by code.
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3

complexity:
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/test/**']

# io.nlopez.compose.rules — https://mrmans0n.github.io/compose-rules/
Compose:
  ComposableAnnotationNaming:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The design system and router provide these on purpose; nothing else should.
    allowedCompositionLocals: >-
      LocalAppColors,LocalAppAccent,LocalAppSpacing,LocalAppRadius,
      LocalAppSizes,LocalAppTypography,LocalAppMotion,LocalAppNavigator
  ContentEmitterReturningValues:
    active: true
    # Design-system components emit UI; the rules only know the platform's own.
    contentEmitters: AppText,AppButton,AppCard,AppPressable,AppIcon,AppTopBar,AppScaffold,AppMessageView,AppProgressIndicator,AppAdaptiveLayout
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
    # Design-system components emit UI; the rules only know the platform's own.
    contentEmitters: AppText,AppButton,AppCard,AppPressable,AppIcon,AppTopBar,AppScaffold,AppMessageView,AppProgressIndicator,AppAdaptiveLayout
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
    # Design-system components emit UI; the rules only know the platform's own.
    contentEmitters: AppText,AppButton,AppCard,AppPressable,AppIcon,AppTopBar,AppScaffold,AppMessageView,AppProgressIndicator,AppAdaptiveLayout
  MutableParams:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
